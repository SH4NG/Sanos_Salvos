version: '3.8'

services:

  mysql-db:
    build: ./database
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: myuser
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"

  usuario-service:
    build: ./Usuario_service
    container_name: usuario-service
    depends_on:
      - mysql-db
    ports:
      - "8081:8081"

  mascota-service:
    build: ./Mascota_service
    container_name: mascota-service
    depends_on:
      - mysql-db
    ports:
      - "8082:8082"

  reporte-service:
    build: ./Reporte_service
    container_name: reporte-service
    depends_on:
      - mysql-db
    ports:
      - "8083:8083"

  notificacion-service:
    build: ./Notificacion_service
    container_name: notificacion-service
    depends_on:
      - mysql-db
    ports:
      - "8084:8084"