version: "3.8"

services:

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: myuser
      MYSQL_PASSWORD: password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/create.sql:/docker-entrypoint-initdb.d/create.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - sanos-network

  usuario-service:
    build: ./Usuario_service
    container_name: usuario-service
    restart: always

    depends_on:
      mysql-db:
        condition: service_healthy

    ports:
      - "8081:8081"

    networks:
      - sanos-network

  mascota-service:
    build: ./Mascota_service
    container_name: mascota-service
    restart: always

    depends_on:
      mysql-db:
        condition: service_healthy

    ports:
      - "8082:8082"

    networks:
      - sanos-network

  reporte-service:
    build: ./Reporte_service
    container_name: reporte-service
    restart: always

    depends_on:
      mysql-db:
        condition: service_healthy

    ports:
      - "8083:8083"

    networks:
      - sanos-network

  notificacion-service:
    build: ./Notificacion_service
    container_name: notificacion-service
    restart: always

    depends_on:
      mysql-db:
        condition: service_healthy

    ports:
      - "8084:8084"

    networks:
      - sanos-network

volumes:
  mysql_data:

networks:
  sanos-network:
    driver: bridge
