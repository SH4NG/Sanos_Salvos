name: CI/CD Sanos Salvos

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      ##################################################
      # COMPILACIÓN
      ##################################################

      - name: Compilar Usuario Service
        working-directory: Usuario_service
        run: mvn clean package -DskipTests

      - name: Compilar Mascota Service
        working-directory: Mascota_service
        run: mvn clean package -DskipTests

      - name: Compilar Reporte Service
        working-directory: Reporte_service
        run: mvn clean package -DskipTests

      - name: Compilar Notificacion Service
        working-directory: Notificacion_service
        run: mvn clean package -DskipTests

      ##################################################
      # DOCKER
      ##################################################

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Usuario
        run: docker build -t sh4ng/usuario-service:v1 ./Usuario_service

      - name: Build Mascota
        run: docker build -t sh4ng/mascota-service:v1 ./Mascota_service

      - name: Build Reporte
        run: docker build -t sh4ng/reporte-service:v1 ./Reporte_service

      - name: Build Notificacion
        run: docker build -t sh4ng/notificacion-service:v1 ./Notificacion_service

      - name: Push Usuario
        run: docker push sh4ng/usuario-service:v1

      - name: Push Mascota
        run: docker push sh4ng/mascota-service:v1

      - name: Push Reporte
        run: docker push sh4ng/reporte-service:v1

      - name: Push Notificacion
        run: docker push sh4ng/notificacion-service:v1

      ##################################################
      # VALIDACIÓN
      ##################################################

      - name: Validar Docker Compose
        run: docker compose config

      ##################################################
      # DESPLIEGUE EN AWS
      ##################################################

      - name: Desplegar en Docker Swarm
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PRIVATE_KEY }}

          script: |
            cd /home/ubuntu
            docker stack deploy -c docker-stack.yml sanos-salvos
```
