spring.application.name=usuario-service

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.datasource.url=jdbc:mysql://mysql-db:3306/usuarios_db
spring.datasource.username=myuser
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
aws.region=us-east-2
aws.sqs.queue-url=https://sqs.us-east-2.amazonaws.com/797452357456/cola-usuarios
logging.level.org.springframework.web=info
logging.level.org.hibernate=info

logging.file.name=usuario.log

server.port=8081